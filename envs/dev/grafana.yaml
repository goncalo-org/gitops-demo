ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.dev.localhost
persistence:
  enabled: false   # dashboards and data sources are provisioned; nothing to keep
admin:
  existingSecret: grafana-admin   # created by scripts/bootstrap.sh
  userKey: admin-user
  passwordKey: admin-password
testFramework:
  enabled: false
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: observability
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.observability.svc
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.observability.svc:3100
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.observability.svc:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            tags:
              - key: k8s.cluster.name
                value: cluster
