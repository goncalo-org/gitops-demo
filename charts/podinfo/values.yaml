replicaCount: 1

image:
  repository: ghcr.io/stefanprodan/podinfo
  # Shared by all environments: promotion moves this value between branches.
  tag: "6.9.3"

# Shown on the podinfo UI so you can tell environments apart.
message: ""

ingress:
  host: podinfo.local

resources: {}

# Traces go to the cluster's Alloy agent (same address in every cluster).
otel:
  serviceName: podinfo
  endpoint: http://alloy.observability.svc:4317
