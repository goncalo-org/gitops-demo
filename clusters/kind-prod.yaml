kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: prod
nodes:
  - role: control-plane
    extraPortMappings:
      # Traefik "web" nodePort → http://*.prod.localhost:9080 (localhost only)
      - containerPort: 30080
        hostPort: 9080
        listenAddress: "127.0.0.1"
        protocol: TCP
